# The Python side is the dashboard and its checks. The capture tools are Node and need nothing
# from pip. Dependencies stay in requirements.txt, which is what the README and CI install; this
# file carries the tool configuration.

[tool.mypy]
# OVER c4x/ ONLY, and non-blocking in CI to start with.
#
# The surface worth typing is the one where a wrong type becomes a wrong NUMBER: the store, the
# project export and delete, and the API that serves them. app.py and tools/ are scripts and are
# checked by the suite instead.
#
# The backlog this started with is cleared and the step BLOCKS. It opened at 20 errors under the
# loose settings below, and turning on check_untyped_defs surfaced 25 more that the loose reading
# had hidden. Both sets are at zero. Four suppressions remain, each commented where it sits, and
# all four are for the same kind of thing: a dash component the library types wrongly or not at all.
#
# What that pass actually found, since "clearing type errors" sounds cosmetic and two of these were
# not: `_harvest_state["error"][:60]` was slicing a float on the line that renders in the header
# whenever a refresh fails, and `PANELLED` had an annotation I had written from memory that claimed
# a shape the only writer does not produce. The stricter setting is what caught the second one.
python_version = "3.12"
files = ["c4x"]
ignore_missing_imports = true      # pandas, dash and plotly ship partial or no stubs
# Types come FROM app.py and tools/ where c4x imports them, but their own errors are not this
# gate's business. Without this the report includes app.py, which is not the surface being typed.
follow_imports = "silent"
check_untyped_defs = true          # was false; the 25 errors it had been hiding are fixed
warn_unused_ignores = true         # so the four ignores report themselves once dash publishes types
warn_redundant_casts = true
show_error_codes = true
# NOT set: disallow_untyped_defs, which requires an annotation on every function. Measured at 278
# errors across 36 files, so it is a separate piece of work and not a setting to flip quietly; left
# off deliberately, with the number, rather than omitted and rediscovered.

[tool.ruff]
line-length = 100          # what app.py and the checks are already written to
target-version = "py311"
extend-exclude = ["tmp", "data", ".md"]

[tool.ruff.lint]
# Beyond the defaults: bugbear for real mistakes, comprehensions and pyupgrade for consistency,
# isort so import order stops being a matter of opinion.
select = ["E", "F", "W", "B", "C4", "UP", "I"]

ignore = [
  # A Dash callback is registered by its decorator and never called by name, so the usual "unused"
  # signals do not apply to this codebase the way they would elsewhere.
  "B008",

  # dict(color=..., size=...) is how Plotly's own documentation writes every figure argument, and 44
  # of the 47 sites this fires on are exactly that. Rewriting them to brace literals would make the
  # code LESS conventional for the library it calls, and fix nothing. Excluded deliberately, with
  # the count, rather than left to be rediscovered as noise and switched off wholesale later.
  "C408",
]

[tool.ruff.lint.per-file-ignores]
# The audit imports app.py after inserting the repo root on sys.path, which has to happen before
# the import and therefore cannot satisfy E402.
"tools/table_audit.py" = ["E402"]

# A test asserts on what a tab RENDERED, so it imports the app after the path is arranged, and it
# reads private callbacks by design: the callback is the delivery path, and calling a builder
# instead would prove the builder works and say nothing about the page.
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No addopts. The runner already passes -q, and setting it here too made pytest -qq, which
# suppresses the "N passed" summary line the runner reads to know the suite actually ran. It
# reported exit 0 with the marker missing and failed the entry, which is the rule working.
filterwarnings = [
  # dash_table is deprecated upstream in favour of dash-ag-grid. That is a migration, not a test
  # failure, and it fires once per component built.
  "ignore::DeprecationWarning",
]
