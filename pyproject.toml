# The Python side is the dashboard and its checks. The capture tools are Node and need nothing
# from pip. Dependencies stay in requirements.txt, which is what the README and CI install; this
# file carries the tool configuration.

[project]
# Not a package: nothing here builds a wheel, and the README installs with `pip -r`. This table
# exists for one field. `requires-python` is the floor CI actually tests: the pinned set in
# constraints-ci.txt does NOT resolve on 3.11 (measured 2026-09-03), and the matrix runs 3.12 and
# 3.14, so a claim of anything lower would be a claim no run has ever checked.
name = "c4x"
version = "0.1.0"
requires-python = ">=3.12"

[tool.mypy]
# OVER c4x/ ONLY, and BLOCKING in CI.
#
# The surface worth typing is the one where a wrong type becomes a wrong NUMBER: the store, the
# project export and delete, and the API that serves them. app.py and tools/ are scripts and are
# checked by the suite instead.
#
# The backlog this started with is cleared, and what that pass found is worth keeping, since
# "clearing type errors" sounds cosmetic and two of them were not: `_harvest_state["error"][:60]`
# was slicing a float on the line that renders in the header whenever a refresh fails, and
# `PANELLED` carried an annotation written from memory that claimed a shape its only writer does
# not produce. The stricter setting below is what caught the second one.
#
# NO COUNTS IN THIS BLOCK, deliberately. Do not add any. It used to say how many errors each pass
# cleared and how many suppressions remain, and every one of those numbers went stale: two
# independent reviews found them wrong, including one number that had been corrected in the line
# below it and left standing in the line above. A count written once and then repeated is a claim
# nobody re-derives. `git grep -c "type: ignore" -- c4x` answers the suppression question in less
# time than it takes to read a sentence about it, and it cannot be out of date.
python_version = "3.12"
files = ["c4x"]
ignore_missing_imports = true      # pandas, dash and plotly ship partial or no stubs
# Types come FROM app.py and tools/ where c4x imports them, but their own errors are not this
# gate's business. Without this the report includes app.py, which is not the surface being typed.
follow_imports = "silent"
check_untyped_defs = true          # was false, and what it had been hiding is fixed
warn_unused_ignores = true         # so a suppression reports itself once dash publishes types
warn_redundant_casts = true
show_error_codes = true
# NOT set: disallow_untyped_defs, which requires an annotation on every function. Separate work
# rather than a setting to flip quietly, and the size of it is worth knowing before anyone starts:
#
#     python -m mypy --disallow-untyped-defs
#
# The size is whatever that command reports today, and this comment does not state it. Two
# different counts stood here in turn, and both were measured against a tree that had moved by
# the time anyone read them: the first before the backlog it described was cleared, the second
# before the frontend and the API grew. Quoting either of them again, even as history, puts a
# number in front of a reader who has no way to tell it is stale. A count nobody re-runs is a
# claim; the command above is the answer.

[tool.ruff]
line-length = 100          # what app.py and the checks are already written to
target-version = "py311"
extend-exclude = ["tmp", "data", ".md"]

[tool.ruff.lint]
# Beyond the defaults: bugbear for real mistakes, comprehensions and pyupgrade for consistency,
# isort so import order stops being a matter of opinion.
select = ["E", "F", "W", "B", "C4", "UP", "I"]

ignore = [
  # A Dash callback is registered by its decorator and never called by name, so the usual "unused"
  # signals do not apply to this codebase the way they would elsewhere.
  "B008",

  # dict(color=..., size=...) is how Plotly's own documentation writes every figure argument, and 44
  # of the 47 sites this fires on are exactly that. Rewriting them to brace literals would make the
  # code LESS conventional for the library it calls, and fix nothing. Excluded deliberately, with
  # the count, rather than left to be rediscovered as noise and switched off wholesale later.
  "C408",
]

[tool.ruff.lint.per-file-ignores]
# The audit imports app.py after inserting the repo root on sys.path, which has to happen before
# the import and therefore cannot satisfy E402.
"tools/table_audit.py" = ["E402"]

# A test asserts on what a tab RENDERED, so it imports the app after the path is arranged, and it
# reads private callbacks by design: the callback is the delivery path, and calling a builder
# instead would prove the builder works and say nothing about the page.
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No addopts. The runner already passes -q, and setting it here too made pytest -qq, which
# suppresses the "N passed" summary line the runner reads to know the suite actually ran. It
# reported exit 0 with the marker missing and failed the entry, which is the rule working.
filterwarnings = [
  # dash_table is deprecated upstream in favour of dash-ag-grid. That is a migration, not a test
  # failure, and it fires once per component built.
  "ignore::DeprecationWarning",
]
