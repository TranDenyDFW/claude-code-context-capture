name: tests

# Runs the whole suite, not a subset, on every interpreter and platform this repo claims to support.
#
# The obstacle was that data/ is gitignored, for good reason: it holds verbatim conversations. Three
# checks read a store, and two node self-tests each carry one store-dependent check that correctly
# FAILS rather than skips when there is none. So CI builds a synthetic store first, and the runner
# says out loud when anything did not execute rather than printing a total that implies otherwise.
#
# WHY A MATRIX, AND WHY A WINDOWS LEG. On 2026-09-02 a change passed on a Windows developer machine,
# passed an independent review on the same machine, and failed here, twice. The variable was not
# the platform: CI installs pandas 3.0.5 from constraints-ci.txt and that machine ran 2.3.3, and
# pandas 3 represents a missing text cell as NaN where pandas 2 used None. A second interpreter
# leg would not have caught that either; the pin check in tools/make_constraints.py does. What the
# Windows leg catches is the reverse: a CRLF write, a path separator, a locale, anything that passes
# on Ubuntu and fails where most of this tool's users actually run it.
#
# WHY THE FAN-IN JOB IS CALLED `suite`. Branch protection on main requires a status check with
# exactly that context. A matrix job reports as `checks (ubuntu-latest, 3.12)` and so on, none of
# which is `suite`, so without the fan-in the protection would either block every merge or,
# worse, silently require nothing. The fan-in is green only when every leg is.

on:
  push:
    branches: [main]
  pull_request:
  # By name, for the pull requests the pins and pricing jobs open with GITHUB_TOKEN: a push or a
  # pull request made with that token starts no workflow, so those jobs ask for this one on their
  # branch explicitly, and the `suite` check lands on the commit the pull request points at.
  workflow_dispatch:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.12', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    name: checks (${{ matrix.os }}, ${{ matrix.python }})
    defaults:
      run:
        # bash on every leg, including Windows, so one script serves all three. GitHub's Windows
        # runners ship Git Bash; `rm -f` and `$VAR` mean the same thing everywhere below.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Node 24: every tool opens the store through the built-in node:sqlite, which earlier majors
      # shipped behind an experimental flag.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          # Keyed on the lockfile this job now installs from. Without a cache the frontend install
          # below is a fresh network fetch on every run.
          cache: npm
          # BOTH lockfiles. The root one pins eslint, the frontend one pins the build and test
          # toolchain, and a cache keyed on only one of them goes stale the moment the other moves.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # `-c constraints-ci.txt` pins everything including transitives, so a run six months from
      # now installs the graph today's green run installed. The requirements files keep their lower
      # bounds, because they are what someone installing this to look at their own context gets.
      # The same command is what CONTRIBUTING tells a developer to run, and the suite checks that
      # the installed versions match the pins, so a machine that drifted from CI says so itself.
      - name: Install Python dependencies
        run: |
          pip install -c constraints-ci.txt -r requirements.txt -r requirements-dev.txt
          pip check

      # `ci`, not `install`: it installs exactly the lockfile and fails if package.json and the
      # lockfile disagree, which is the whole point of committing one.
      - name: Install the linter
        run: npm ci

      # WITHOUT THIS THE FRONTEND CHECKS DO NOT RUN. tools/run_tests.mjs skips the typecheck and
      # Vitest when frontend/node_modules is absent, and this job never installed it, so those two
      # gates were skipped on every run CI ever made while the job reported success.
      - name: Install the frontend
        run: npm ci --prefix frontend

      # Synthetic, and it says so in every row it writes. Nothing here came from a conversation.
      - name: Build the fixture store
        run: node tools/make_fixture.mjs

      # Linters before the suite: a lint failure is cheap to read, and a green suite over code
      # nobody linted is how the two drift apart.
      - name: Lint the Python side
        run: python -m ruff check app.py tools/

      # BLOCKING. This step was added non-blocking, with a backlog and a promise that it would
      # become blocking once that backlog was worked down. It was, so it is: `continue-on-error` is
      # gone and a type error fails the job rather than being reported into an already-green run.
      #
      # The settings, the suppressions and what `disallow_untyped_defs` would still cost are in
      # pyproject.toml. Sizes are not repeated here: this comment carried three counts and every one
      # of them went stale, which is the whole argument for reading them where they are measured.
      - name: Type-check the store, the API and the project moves
        run: python -m mypy

      # The PINNED eslint from the root lockfile. This was `npx --yes eslint .`, which fetches
      # whatever is newest that minute, so what counted as an error could change between two runs
      # of the same commit.
      - name: Lint the node tools
        run: npm run lint

      # --strict, so a check that did not run fails the job. The runner has always SAID a skip
      # means "NOT A FULL RUN" and then exited 0, which is the half GitHub reads.
      - name: Run the suite
        run: node tools/run_tests.mjs --strict

      # The fixture is a database of made-up rows, but it is still a database that looks like the
      # real one. Nothing should carry it out of the job.
      - name: Confirm no store is left behind
        if: always()
        run: rm -f data/context.db data/context.db-wal data/context.db-shm

  # The one context branch protection requires. Green only when every matrix leg is green; a leg
  # that was skipped or cancelled is a failure here, not an absence, because an absence is how a
  # required check quietly stops requiring anything.
  suite:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every leg must have succeeded
        run: |
          echo "checks result: ${{ needs.checks.result }}"
          test "${{ needs.checks.result }}" = "success"
