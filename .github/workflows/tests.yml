name: tests

# Runs the whole suite, not a subset.
#
# The obstacle was that data/ is gitignored, for good reason: it holds verbatim conversations. Three
# checks read a store, and two node self-tests each carry one store-dependent check that correctly
# FAILS rather than skips when there is none. So CI builds a synthetic store first, and the runner
# says out loud when anything did not execute rather than printing a total that implies otherwise.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4, v4.4.0

      # Node 24: every tool opens the store through the built-in node:sqlite, which earlier majors
      # shipped behind an experimental flag.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # actions/setup-node@v4, v4.4.0
        with:
          node-version: '24'
          # Keyed on the lockfile this job now installs from. Without a cache the frontend install
          # below is a fresh network fetch on every run.
          cache: npm
          # BOTH lockfiles. The root one pins eslint, the frontend one pins the build and test
          # toolchain, and a cache keyed on only one of them goes stale the moment the other moves.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python@v5, v5.6.0
        with:
          python-version: '3.12'

      # `-c constraints-ci.txt` pins everything including transitives, so a run six months from
      # now installs the graph today's green run installed. The requirements files keep their lower
      # bounds, because they are what someone installing this to look at their own context gets.
      - name: Install Python dependencies
        run: |
          pip install -c constraints-ci.txt -r requirements.txt -r requirements-dev.txt
          pip check

      # WITHOUT THIS THE FRONTEND CHECKS DO NOT RUN. tools/run_tests.mjs skips the typecheck and
      # Vitest when frontend/node_modules is absent, and this job never installed it, so those two
      # gates were skipped on every run CI ever made while the job reported success. `ci` rather
      # than `install` because frontend/package-lock.json is committed.
      # `ci`, not `install`: it installs exactly the lockfile and fails if package.json and the
      # lockfile disagree, which is the whole point of committing one.
      - name: Install the linter
        run: npm ci

      - name: Install the frontend
        run: npm ci --prefix frontend

      # Synthetic, and it says so in every row it writes. Nothing here came from a conversation.
      - name: Build the fixture store
        run: node tools/make_fixture.mjs

      # Linters before the suite: a lint failure is cheap to read, and a green suite over code
      # nobody linted is how the two drift apart.
      - name: Lint the Python side
        run: python -m ruff check app.py tools/

      # BLOCKING. This step was added non-blocking with a 20-error backlog and the promise that it
      # would become blocking once the number was worked down. It is: 20 under the loose settings,
      # then 25 more that turning on `check_untyped_defs` revealed, all at zero. `continue-on-error`
      # is gone, so a type error fails the job rather than being reported into an already-green run.
      #
      # Settings and the four remaining suppressions are in pyproject.toml, next to the count of
      # what `disallow_untyped_defs` would still cost.
      - name: Type-check the store, the API and the project moves
        run: python -m mypy

      # The PINNED eslint from the root lockfile. This was `npx --yes eslint .`, which fetches
      # whatever is newest that minute, so what counted as an error could change between two runs
      # of the same commit.
      - name: Lint the node tools
        run: npm run lint

      # --strict, so a check that did not run fails the job. The runner has always SAID a skip
      # means "NOT A FULL RUN" and then exited 0, which is the half GitHub reads.
      - name: Run the suite
        run: node tools/run_tests.mjs --strict

      # The fixture is a database of made-up rows, but it is still a database that looks like the
      # real one. Nothing should carry it out of the job.
      - name: Confirm no store is left behind
        if: always()
        run: rm -f data/context.db data/context.db-wal data/context.db-shm
