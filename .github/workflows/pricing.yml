name: pricing

# Keep c4x/prices.json equal to what Anthropic publishes.
#
# There is no pricing API, so this parses two pages: the docs table, which lists every model, and
# claude.com/pricing, which lists the current few. Where both name a model they must agree; a
# disagreement FAILS rather than being reconciled, because two prices for one model means the tool
# cannot tell which is real.
#
# Deliberately NOT part of the required test suite. The suite runs the parser's --self-test, which
# is offline and proves the parsing works; this runs --check, which needs the network. A docs-page
# outage should redden the pricing job and nothing else, rather than blocking an unrelated PR.

on:
  push:
    branches: [main]
    # Without this the auto-commit below re-triggers this workflow, which finds nothing to do and
    # stops - but it still costs a run per push, and a loop that terminates by luck is still a loop.
    paths-ignore:
      - 'c4x/prices.json'
  schedule:
    # Prices move without anyone pushing. Daily, so a stale table is at most a day stale.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # A pull request needs this. The job no longer pushes to main, so `contents: write` is now only
  # for the branch it pushes the change onto.
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4, v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # actions/setup-node@v4, v4.4.0
        with:
          node-version: '24'

      # Offline first. If the parser itself is broken there is no point asking it what the prices
      # are, and the failure should name the parser rather than the pricing pages.
      - name: The parser's own checks
        run: node tools/fetch-pricing.mjs --self-test

      - name: Read the published prices
        id: refresh
        run: node tools/fetch-pricing.mjs --write

      # A PULL REQUEST, NOT A PUSH TO MAIN.
      #
      # This used to `git push` straight to main. That predates branch protection, and it is
      # exactly the hole protection exists to close: a commit lands on main that the required
      # `suite` check never evaluated, because a push made with GITHUB_TOKEN does not trigger
      # workflows. GitHub also enforces required checks on direct pushes, so once main was
      # protected this step was going to start failing the next time prices actually moved.
      #
      # Opening a PR puts the price table through the same gate as everything else. The branch name
      # is fixed, so a second run updates the same PR rather than opening another.
      - name: Open a pull request if the prices moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- c4x/prices.json; then
            echo "prices unchanged"
            exit 0
          fi
          BRANCH=chore/published-prices
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add c4x/prices.json
          git commit -m "chore: published prices moved

          Written by tools/fetch-pricing.mjs from the two pricing pages it parses. The docs table
          supplies the numbers and claude.com/pricing audits them; this commit exists because they
          agreed with each other and disagreed with the committed table."
          # --force, because this branch is a rolling snapshot of one file and nothing else ever
          # commits to it. A rejected push here would leave the run green with nothing opened.
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "the pull request already exists and now carries the newer prices"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: published prices moved" \
              --body "Opened by .github/workflows/pricing.yml. tools/fetch-pricing.mjs read the two pricing pages, they agreed with each other and disagreed with the committed table.

          This is a pull request rather than a push to main so that the price table goes through the same \`suite\` check as every other change."
          fi
