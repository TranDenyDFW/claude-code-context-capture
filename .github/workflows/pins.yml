name: pins

# Re-resolve constraints-ci.txt as a SET, monthly, on both platforms CI runs, and open a pull
# request when a pin moved.
#
# WHY NOT DEPENDABOT FOR THIS FILE. constraints-ci.txt is the answer to one question, "what does
# pip install today for these requirements", and every line in it depends on the others: pydantic
# pins pydantic_core exactly, fastapi bounds starlette, and so on. Dependabot discovers the file by
# content (any .txt that reads as requirements) and moves one line at a time. Its first attempt,
# PR #49, bumped pydantic_core alone and could not install (ResolutionImpossible on all three
# legs). No dependabot.yml setting scopes it off one file, so the pip ecosystem is not configured
# there at all, and this job is the mechanism instead: the same tool a developer runs.
#
# WHY TWO RUNNERS AND A FAN-IN. pip evaluates environment markers on the interpreter that runs it,
# and `--platform` changes only which wheel tags it accepts, so an Ubuntu runner never requests
# `pywinpty ; sys_platform == "win32"` and cannot pin it, while a Windows machine requesting it
# for Linux tags finds no wheel and fails. The third run of this job proved the first half: it
# wrote 52 pins and refused, because pywinpty was unpinned. So each platform resolves its own set
# with `--resolve-only`, and one `--regenerate --from` unions them: a plain pin where both agree,
# a marker where only one platform installs the package, a refusal where they disagree.
#
# WHY THE LAST STEP DISPATCHES tests.yml BY NAME. A push or a pull request made with GITHUB_TOKEN
# starts no workflow, by GitHub's design against loops. Left there, the pull request this opens
# would sit with no `suite` check and branch protection would never let it merge. workflow_dispatch
# is the one event GITHUB_TOKEN may raise, so the job asks for the suite on the branch explicitly,
# and the check lands on the same commit the pull request points at.
#
# Not part of the required suite: it needs the network and the index, and an outage should redden
# this job and nothing else.

on:
  schedule:
    # The first of the month. Dependabot's npm and actions groups run monthly too; one morning a
    # month for every kind of bump keeps the noise in one place.
    - cron: '23 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # For the dispatch of tests.yml at the end.
  actions: write

jobs:
  resolve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: resolve (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The FLOOR interpreter. A set resolved on a newer Python can include wheels the floor cannot
      # install; a set resolved on the floor installs on everything the matrix runs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # The tool's own import, from the CURRENT pins, before those pins are re-resolved. The first
      # run of this job died here: a bare runner has no `packaging`, and the step that regenerates
      # the file cannot be the one that installs from it.
      - name: The tool's one dependency
        run: pip install -c constraints-ci.txt packaging

      - name: Resolve this platform's set
        run: python tools/make_constraints.py --resolve-only resolve-${{ matrix.os }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: resolve-${{ matrix.os }}
          path: resolve-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: The tool's one dependency
        run: pip install -c constraints-ci.txt packaging

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: resolve-*
          merge-multiple: true
          path: resolves

      # Both sets, or nothing: a union of one platform is the file this job exists to stop writing.
      - name: Both platforms reported
        run: |
          ls -l resolves
          test -s resolves/resolve-ubuntu-latest.json
          test -s resolves/resolve-windows-latest.json

      - name: Union the two sets into constraints-ci.txt
        run: |
          python tools/make_constraints.py --regenerate \
            --from resolves/resolve-ubuntu-latest.json resolves/resolve-windows-latest.json

      # Offline: every direct requirement pinned, no pin below its own floor, the rewrite and the
      # union rows, and the planted failures still caught. The drift row compares installed
      # packages to pins and nothing from the requirements is installed yet, which it treats as
      # absence, not drift.
      - name: The new set still covers the requirements
        run: python tools/make_constraints.py --self-test

      # The one thing a resolve cannot prove by itself: that the set it wrote INSTALLS, with the
      # markers applied, with no conflicts. This is the step Dependabot's one-line bump failed. The
      # Windows install is proven by the pull request's own Windows leg.
      - name: The new set installs and pip check agrees
        run: |
          pip install -c constraints-ci.txt -r requirements.txt -r requirements-dev.txt
          pip check

      # A PULL REQUEST, NOT A PUSH TO MAIN, for the reason pricing.yml gives: main is protected and
      # a push made with GITHUB_TOKEN would neither run the suite nor be allowed through. The
      # branch name is fixed, so a second run updates the same pull request rather than opening
      # another.
      - name: Open a pull request if a pin moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- constraints-ci.txt; then
            echo "pins unchanged"
            exit 0
          fi
          echo "pins that moved:"
          git diff --no-color -- constraints-ci.txt | grep -E '^[-+][a-zA-Z]' || true
          BRANCH=chore/regenerated-pins
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add constraints-ci.txt
          git commit -m "chore: re-resolve the pinned set

          Written by tools/make_constraints.py from a resolve on an Ubuntu runner and a
          resolve on a Windows runner, unioned, then installed and pip-checked on the
          Ubuntu runner. Every line moved together, which is the only way this file is
          allowed to change."
          # --force, because this branch is a rolling snapshot of one file and nothing else ever
          # commits to it. A rejected push here would leave the run green with nothing opened.
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "the pull request already exists and now carries the newer set"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: re-resolve the pinned set" \
              --body "Opened by .github/workflows/pins.yml. tools/make_constraints.py resolved the set on an Ubuntu runner and on a Windows runner (Python 3.12), unioned them, the self-test passed, and the union installed with pip check clean on the Ubuntu runner; the Windows leg below proves the other half.

          The suite on this branch was started by the same job: a pull request opened with GITHUB_TOKEN gets no automatic run, so the job dispatches tests.yml on the branch and the check lands here."
          fi
          # The suite, asked for by name, on the commit the pull request now points at.
          gh workflow run tests.yml --ref "$BRANCH"
          echo "suite dispatched on $BRANCH"
