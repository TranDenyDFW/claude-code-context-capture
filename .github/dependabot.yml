# Monthly, grouped, for the npm roots and the pinned actions. A pin that never moves is a pin that
# eventually cannot install, and a pin that moves by hand is a guess; these PRs are the third way.
#
# NO pip ECOSYSTEM HERE, ON PURPOSE. The Python set CI installs lives in constraints-ci.txt, and
# every line of it depends on the others: pydantic pins pydantic_core exactly, fastapi bounds
# starlette. Dependabot discovers that file by content and moves one line at a time; its first
# attempt (PR #49) bumped pydantic_core alone and could not install. Nothing in this file can scope
# it off one .txt, so Python pins move by re-resolving the whole set instead:
# .github/workflows/pins.yml runs `python tools/make_constraints.py --regenerate` on the same
# monthly morning and opens a pull request when a pin moved.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      root-tooling:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]

  # Actions are pinned to commit SHAs in the workflow; dependabot keeps the SHA and the version
  # comment beside it moving together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
