<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- What this tool is about, in the only detail a 16px tab can hold: a context window, part
       full, with the line where it compacts. The scaffold shipped Vite's logo, which says
       something true about the build tool and nothing about the app. -->
  <rect width="32" height="32" rx="6" fill="#0d1117"/>
  <rect x="6" y="6" width="20" height="20" rx="2" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="8" y="16" width="16" height="8" rx="1" fill="#58a6ff"/>
  <line x1="6" y1="13" x2="26" y2="13" stroke="#f85149" stroke-width="2" stroke-dasharray="3 2"/>
</svg>
